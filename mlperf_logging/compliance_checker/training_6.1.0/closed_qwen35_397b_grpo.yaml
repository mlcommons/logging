- BEGIN:
    CODE: >
        s.update({
            'global_batch_size': None,
            'num_prompts_per_step': None,
            'next_validation_samples': None,
            'validation_start_samples': None,
            'target_accuracy': 0.69,
        })

- KEY:
    NAME:  global_batch_size
    REQ:   EXACTLY_ONE
    CHECK: " is_integer(v['value']) and v['value'] > 0 "
    POST: |
        s['global_batch_size'] = v['value']
        s['validation_start_samples'] = v['value'] * math.ceil(2.5 + 3840 / v['value'])
        s['next_validation_samples'] = s['validation_start_samples']

- KEY:
    NAME:  max_sequence_length
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 65536 "

- KEY:
    NAME:  eval_samples
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 256 "

- KEY:
    NAME:  init_checkpoint_step
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 0 "

- KEY:
    NAME:  max_steps
    REQ:   EXACTLY_ONE

- KEY:
    NAME:  opt_name
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 'adamw' "

- KEY:
    NAME:  opt_base_learning_rate
    REQ:   EXACTLY_ONE
    CHECK: " abs(v['value'] - 1.0e-6 * (s['global_batch_size'] / 256) ** 0.5) < 1e-9 "

- KEY:
    NAME:  opt_end_learning_rate
    REQ:   EXACTLY_ONE
    CHECK: " abs(v['value'] - 1.0e-6 * (s['global_batch_size'] / 256) ** 0.5) < 1e-9 "

- KEY:
    NAME:  opt_adamw_beta_1
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 0.9 "

- KEY:
    NAME:  opt_adamw_beta_2
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 0.999 "

- KEY:
    NAME:  opt_adamw_epsilon
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 1e-8 "

- KEY:
    NAME:  opt_adamw_weight_decay
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 0.0 "

- KEY:
    NAME:  opt_gradient_clip_norm
    REQ:   EXACTLY_ONE
    CHECK: " abs(v['value'] - 0.125 * (256 / s['global_batch_size']) ** 0.5) < 1e-9 "

- KEY:
    NAME:  opt_learning_rate_warmup_steps
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 0 "

- KEY:
    NAME:  opt_learning_rate_decay_steps
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 100000 "

- KEY:
    NAME:  opt_learning_rate_decay_schedule
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 'constant' "

- KEY:
    NAME:  generation_training_rollout_temperature
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 1.0 "

- KEY:
    NAME:  generation_training_rollout_top_p
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 1.0 "

- KEY:
    NAME:  generation_validation_rollout_temperature
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 0.1 "

- KEY:
    NAME:  generation_validation_rollout_top_p
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 0.95 "

- KEY:
    NAME:  num_prompts_per_step
    REQ:   EXACTLY_ONE
    CHECK: " is_integer(v['value']) and v['value'] > 0 "
    POST:  " s['num_prompts_per_step'] = v['value'] "

- KEY:
    NAME:  num_generations_per_prompt
    REQ:   EXACTLY_ONE
    CHECK:
        - "v['value'] == 16"
        - "s['global_batch_size'] == s['num_prompts_per_step'] * v['value']"

- KEY:
    NAME:  eval_accuracy
    REQ:   AT_LEAST_ONE
    CHECK:
        - "'samples_count' in v['metadata']"
        - "v['metadata']['samples_count'] == s['next_validation_samples']"
        - "0.0 <= v['value'] <= 1.0"
    POST: |
        if v['metadata']['samples_count'] == s['next_validation_samples']:
            s['next_validation_samples'] += s['global_batch_size']
    ATLEAST_ONE_CHECK: "v['value'] > s['target_accuracy']"
