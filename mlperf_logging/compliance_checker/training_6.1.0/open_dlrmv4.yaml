# The open division is for algorithmic changes, not for buying convergence with
# a learning rate the closed division would reject, so the same band around the
# reference scaling law applies here.

- KEY:
    NAME:  global_batch_size
    REQ:   EXACTLY_ONE
    CHECK: " is_integer(v['value']) and v['value'] > 0 "
    POST: |
        s['lr_min'] = 0.5e-6 * v['value'] / 8192
        s['lr_max'] = 1.5e-6 * v['value'] / 8192

- KEY:
    NAME:  gradient_accumulation_steps
    REQ:   EXACTLY_ONE
    CHECK: " is_integer(v['value']) and v['value'] > 0 "

- KEY:
    NAME:  train_samples
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 2290835423 "

- KEY:
    NAME:  eval_samples
    REQ:   EXACTLY_ONE
    CHECK: " v['value'] == 2058204 "

- KEY:
    NAME:  max_sequence_length
    REQ:   EXACTLY_ONE
    CHECK: " is_integer(v['value']) and v['value'] > 0 "

- KEY:
    NAME:  opt_name
    REQ:   EXACTLY_ONE

- KEY:
    NAME:  opt_base_learning_rate
    REQ:   EXACTLY_ONE
    # The bounds come from global_batch_size, and the rules run in log order, so
    # a log that reports the learning rate first fails the guard rather than
    # raising on the comparison.
    CHECK: " s.get('lr_min') is not None and s['lr_min'] * (1 - 1e-9) <= v['value'] <= s['lr_max'] * (1 + 1e-9) "

- KEY:
    NAME:  opt_adam_beta_1
    REQ:   EXACTLY_ONE

- KEY:
    NAME:  opt_adam_beta_2
    REQ:   EXACTLY_ONE

- KEY:
    NAME:  opt_adam_epsilon
    REQ:   EXACTLY_ONE

- KEY:
    NAME:  opt_weight_decay
    REQ:   EXACTLY_ONE

- KEY:
    NAME:  opt_gradient_clip_norm
    REQ:   EXACTLY_ONE

- KEY:
    NAME:  opt_sparse_name
    REQ:   EXACTLY_ONE

- KEY:
    NAME:  opt_sparse_base_learning_rate
    REQ:   EXACTLY_ONE
    # Unlike the closed division this is not pinned to the dense rate, so it
    # needs the band applied independently.
    CHECK: " s.get('lr_min') is not None and s['lr_min'] * (1 - 1e-9) <= v['value'] <= s['lr_max'] * (1 + 1e-9) "

- KEY:
    NAME:  opt_learning_rate_warmup_steps
    REQ:   EXACTLY_ONE

- KEY:
    NAME:  opt_learning_rate_warmup_start_lr
    REQ:   EXACTLY_ONE

- KEY:
    NAME:  eval_every_data_pct
    REQ:   EXACTLY_ONE

- KEY:
    NAME:  eval_accuracy
    REQ:   AT_LEAST_ONE
    CHECK:
        - "'samples_count' in v['metadata']"
        - "0.0 <= v['value'] <= 1.0"
    ATLEAST_ONE_CHECK: "v['value'] >= 0.75"
